name: Build Flutter APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APKs for website
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk abjikdata-app-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk abjikdata-app.apk

      - name: Upload APK to website via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "abjikdata-app.apk,abjikdata-app-debug.apk"
          target: "/home/kh_12405a3607a5/public_html/downloads/"
          strip_components: 0

      - name: Upload APKs as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
