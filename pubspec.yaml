publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.5.0
  intl: ^0.20.0
  flutter_secure_storage: ^10.0.0
  font_awesome_flutter: ^10.6.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  fluttertoast: ^9.1.0
  pin_code_fields: ^8.0.1
  clipboard: ^0.1.3
  share_plus: ^13.1.0
  lottie: ^3.0.0
  image_picker: ^1.2.0
  local_auth: ^2.3.0
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
